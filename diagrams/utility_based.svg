<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="470" viewBox="0 0 1020 470"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#137D70"/></marker></defs><rect width="1020" height="470" rx="18" fill="#F6FAF7"/><text x="35" y="40" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#19372E">Utility-Based Agent</text><rect x="35" y="230" width="170" height="110" rx="14" fill="#FFFFFF" stroke="#B8D3C7"/><text x="120.0" y="256" text-anchor="middle" fill="#19372E" font-family="Arial,sans-serif" font-size="16">Input / perception</text><text x="120.0" y="276" text-anchor="middle" fill="#19372E" font-family="Arial,sans-serif" font-size="12">Order and visible conditions</text><rect x="300" y="230" width="220" height="110" rx="14" fill="#E1F2EB" stroke="#B8D3C7"/><text x="410.0" y="256" text-anchor="middle" fill="#19372E" font-family="Arial,sans-serif" font-size="16">Select maximum utility</text><rect x="610" y="230" width="160" height="110" rx="14" fill="#FFFFFF" stroke="#B8D3C7"/><text x="690.0" y="256" text-anchor="middle" fill="#19372E" font-family="Arial,sans-serif" font-size="16">Action</text><text x="690.0" y="276" text-anchor="middle" fill="#19372E" font-family="Arial,sans-serif" font-size="12">Selected delivery operation</text><rect x="850" y="230" width="145" height="110" rx="14" fill="#FFFFFF" stroke="#B8D3C7"/><text x="922.5" y="256" text-anchor="middle" fill="#19372E" font-family="Arial,sans-serif" font-size="16">Environment</text><text x="922.5" y="276" text-anchor="middle" fill="#19372E" font-family="Arial,sans-serif" font-size="12">Execute and observe</text><rect x="300" y="75" width="270" height="125" rx="14" fill="#E1F2EB" stroke="#B8D3C7"/><text x="435.0" y="101" text-anchor="middle" fill="#19372E" font-family="Arial,sans-serif" font-size="16">Utility preferences</text><text x="435.0" y="121" text-anchor="middle" fill="#19372E" font-family="Arial,sans-serif" font-size="12">Normalize time, cost, distance</text><text x="435.0" y="141" text-anchor="middle" fill="#19372E" font-family="Arial,sans-serif" font-size="12">and congestion</text><polyline points="205,285 300,285" fill="none" stroke="#137D70" stroke-width="2" marker-end="url(#arrow)"/><polyline points="520,285 610,285" fill="none" stroke="#137D70" stroke-width="2" marker-end="url(#arrow)"/><polyline points="770,285 850,285" fill="none" stroke="#137D70" stroke-width="2" marker-end="url(#arrow)"/><polyline points="410,200 410,230" fill="none" stroke="#137D70" stroke-width="2" marker-end="url(#arrow)"/><polyline points="922,340 922,425 120,425 120,340" fill="none" stroke="#137D70" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="457" font-family="Arial,sans-serif" font-size="12" fill="#587167">Single independent agent. Feedback returns observations for the next decision.</text></svg>